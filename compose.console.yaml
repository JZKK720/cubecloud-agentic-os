# C2 — compose weave (doctrine §3): the kernel joins the AI Workspace
# fabric. Mirrors cubecloud-agent's deploy/docker compose conventions
# (healthchecks, .env cascade, host-attach override).
#
# Two ways to run:
#
#   1. Standalone (kernel attaches to a workspace on the HOST):
#        docker compose -p cubecloud-console -f compose.console.yaml up -d
#      The kernel probes http://host.docker.internal:6767 (the host's
#      cubecloud-agent quickstart stack) via extra_hosts.
#
#   2. Joined to the workspace fabric (kernel + workspace on one network):
#        docker compose -p cubecloud-agent-full \
#          -f <workspace>/deploy/docker/docker-compose.quickstart.yaml \
#          -f compose.console.yaml up -d
#      Set CONSOLE_WORKSPACE_URL=http://agent-meow-server:6767 in .env —
#      service DNS replaces the host-gateway hop.
#
# Browser shell: http://localhost:6770 (serves out/renderer + /shim.js).
#
# Runtime gateway. Two different hops are involved and they are easy to
# confuse:
#
#   * the WORKSPACE (6767) — optional, the cubecloud-agent stack;
#   * the RUNTIME gateway (8642) — required to run an AI turn at all. The
#     kernel attaches to it over HTTP; it does not embed a runtime.
#
# Both are host services, and a container's loopback is its own, so both
# are reached through host.docker.internal. CONSOLE_RUNTIME_BASE_URL sets
# the runtime hop and already defaults to the right value; without
# HERMES_API_SERVER_KEY the kernel reaches the gateway but cannot
# authenticate. Copy `.env.console.example` to `.env` for the full set.
# Being "up and healthy" does not imply a turn can run — see the
# `Assert the kernel targets the configured runtime` step in ci.yml.

services:
  console-backend:
    build:
      context: ./
      dockerfile: agent-desktop/console-backend/Dockerfile
    image: ${CONSOLE_IMAGE:-cubecloud-console-backend}:${CONSOLE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      CONSOLE_KERNEL_PORT: "6770"
      # Bind 0.0.0.0 so the published :6770 reaches the kernel — a
      # loopback bind is unreachable through a container port mapping.
      CONSOLE_KERNEL_HOST: "0.0.0.0"
      # Row-A probe target. Standalone default: the host's workspace via
      # host-gateway. Fabric-joined deployments override with service DNS.
      CUBECLOUD_AGENT_URL: ${CONSOLE_WORKSPACE_URL:-http://host.docker.internal:6767}
      # Kernel home (profiles, memories, wiki, decisions.jsonl) persists
      # in a named volume — the second brain's substance survives restarts.
      HERMES_HOME: /data/hermes
      # Optional fixed token. Without it the kernel generates a random
      # per-boot token and delivers it to the browser shell as a SameSite
      # cookie — fine for the SPA, but an EXTERNAL client (an AG-UI consumer,
      # a smoke script) has no way to learn it. Set CONSOLE_KERNEL_TOKEN to
      # drive the HTTP surface from outside the browser; leave it unset for
      # the normal cookie-only path.
      CONSOLE_KERNEL_TOKEN: ${CONSOLE_KERNEL_TOKEN:-}
      # Where the kernel should find the agent runtime. A container's
      # loopback is its own, so the default 127.0.0.1:8642 resolves to
      # nothing and every AG-UI turn returns RUN_STARTED → RUN_FINISHED
      # with no text. `host.docker.internal` reaches the host's Hermes
      # through host-gateway (declared below). Override to point the
      # kernel at a remote runtime instead.
      CONSOLE_RUNTIME_BASE_URL: ${CONSOLE_RUNTIME_BASE_URL:-http://host.docker.internal:8642}
      # The gateway's shared secret. The kernel has no config file and no
      # per-profile .env, so without this it sends no Authorization header
      # and Hermes answers 401 gateway_auth_failed — which surfaced as an
      # empty AG-UI turn rather than an error. Read from the environment,
      # never written to a file.
      HERMES_API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
    extra_hosts:
      # Standalone mode: reach the host's workspace + local LLM runtimes
      # (Ollama :11434, LM Studio :1234) through the host loopback.
      - "host.docker.internal:host-gateway"
    volumes:
      - console-data:/data/hermes
    ports:
      - "${CONSOLE_PORT:-6770}:6770"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6770/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  console-data: {}