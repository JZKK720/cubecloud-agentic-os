appId: io.cubecloud.desktop
productName: cubecloud-agent-desktop
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
win:
  executableName: cubecloud-agent-desktop
  target:
    - nsis
    - portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: Cubecloud
  vendor: Cubecloud
  category: Utility
  synopsis: Agent Desktop for Cubecloud Agentic-OS
  description: >-
    Agent Desktop is a native desktop shell for orchestrating Cubecloud
    Agentic-OS runtimes, creative apps, and assistant workflows.
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  # Run chmod 4755 on chrome-sandbox so Electron's setuid sandbox helper
  # works on modern Linux distros that disable unprivileged user
  # namespaces (Ubuntu 24.04+, etc.). Closes #395.
  afterInstall: build/linux-after-install.sh
rpm:
  artifactName: ${name}-${version}.${ext}
  # Same SUID fix for .rpm consumers (Fedora 40+ also restricts userns).
  afterInstall: build/linux-after-install.sh
# snap packaging follows the same convention other Electron apps use
# (VS Code, Slack, Discord, Signal). Confinement: strict is the modern
# default and works because we only need the user-home + x11 / wayland
# plugs; grade: stable keeps the snap eligible for the global stable
# channel. The snap store auto-revision is then driven by electron-builder
# via snapcraft credentials in CI (see .github/workflows/release.yml).
snap:
  artifactName: ${name}-${version}.${ext}
  confinement: strict
  grade: stable
  category: utility
  description: >-
    Agent Desktop is a native desktop shell for orchestrating Cubecloud
    Agentic-OS runtimes, creative apps, and assistant workflows.
  plugs:
    - home
    - network
    - network-bind
    - opengl
    - wayland
    - x11
    - desktop
    - desktop-legacy
    - browser-support
    - audio-playback
    - audio-record
    - camera
    - removable-media
npmRebuild: false
