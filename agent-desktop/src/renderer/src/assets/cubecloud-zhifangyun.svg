<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="600" viewBox="0 0 1290 600" fill="none" role="img" aria-labelledby="cc-zfy-title cc-zfy-desc">
  <title id="cc-zfy-title">Cubecloud 智方云</title>
  <desc id="cc-zfy-desc">Cubecloud bilingual brand mark. The Latin "cubecloud" wordmark is the primary line; the Chinese 智方云 (zhifangyun) is the secondary line. Both names refer to the same product family; 智方云 is the legal Chinese brand owned by Cubecloud Limited Company.</desc>

  <!-- Cubecloud mark (icon, copied verbatim from cubecloud-mark.svg so the
       brand pack is self-contained and does not need a sibling <use>). -->
  <g transform="translate(80, 120)">
    <path d="M0 95.228C0 83.504 9.48856 74 21.1933 74H53.1514V121.174C53.1514 127.129 48.3318 131.957 42.3866 131.957H0V95.228Z" fill="#3277F6"/>
    <path d="M114.377 95.228C114.377 83.504 104.888 74 93.1837 74H61.2255V111.065H114.377V95.228Z" fill="#53AFF8"/>
    <path d="M152.725 129.261H102.937V142.739H152.725V129.261Z" fill="#3277F6"/>
    <path d="M134.563 160.935L134.563 111.065L121.107 111.065L121.107 160.935L134.563 160.935Z" fill="#3277F6"/>
    <path d="M114.377 176.772C114.377 188.496 104.888 198 93.1837 198H61.2255V160.935H114.377V176.772Z" fill="#53AFF8"/>
    <path d="M0 176.772C0 188.496 9.48856 198 21.1933 198H53.1514V150.826C53.1514 144.871 48.3318 140.043 42.3866 140.043H0V176.772Z" fill="#3277F6"/>
  </g>

  <!-- Primary Latin wordmark: cubecloud (deep blue, bold).
       font-family uses widely available system fallbacks so the SVG renders
       consistently on GitHub, npm, and inside the desktop splash. -->
  <text x="280" y="240"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800"
        font-size="148"
        letter-spacing="-4"
        fill="#0B1B3A">cubecloud</text>

  <!-- Secondary Chinese wordmark: 智方云 (zhifangyun) in the brand accent blue.
       CJK glyphs render via the user agent's CJK font stack; this is the same
       fallback strategy used by the rest of the Cubecloud-original docs. -->
  <text x="284" y="340"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif"
        font-weight="700"
        font-size="88"
        letter-spacing="6"
        fill="#3277F6">智方云</text>

  <!-- Tagline (Latin + Chinese), light weight, low contrast, supporting only. -->
  <text x="284" y="412"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="34"
        letter-spacing="0.5"
        fill="#4A5A7A">Local-first Agentic OS</text>
  <text x="284" y="460"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif"
        font-weight="500"
        font-size="28"
        letter-spacing="2"
        fill="#4A5A7A">本地优先的智能体操作系统</text>
</svg>
