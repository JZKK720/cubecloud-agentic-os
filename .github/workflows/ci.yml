name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Structural docs check: fail any PR whose prose states a skill count
  # that is not currently true. Pure Node, no install step required.
  # Ground truth (TOTAL/UPSTREAM/REPOS) is computed from
  # .agents/skills/ on every run — see scripts/check-skill-counts.cjs.
  # Numbers are allowed and must render; the earlier contract banned
  # every number in favour of {{SKILLS_*}} tokens, which nothing
  # substituted, so the published README shipped the literal token.
  # This gate is what makes drift impossible: the next skill-add that
  # forgets to update a count fails CI rather than silently landing.
  check-skill-counts:
    name: Verify skill counts in prose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify every stated skill count is true
        run: node scripts/check-skill-counts.cjs

  # Doc-pair section diff: fail any PR that drops an EN section in a
  # documented EN/ZH doc pair, or adds a ZH-only section that drifts
  # further from EN.  Pure Node, no install step required.  Defaults
  # to drift informational; --strict mode (see script) makes
  # missing EN sections a hard fail.  Pair list lives in the script.
  check-doc-pair:
    name: Verify EN/ZH doc pair section parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify section parity across EN/ZH doc pairs
        run: node scripts/check-doc-pair.cjs

  # Mojibake gate: fail any PR that introduces a U+FFFD replacement
  # character, CP1252-substituted UTF-8, or **UTF-8 text decoded as
  # GBK/cp936 and re-saved**. The third case is the one that actually
  # shipped: 131 lines across 19 locale files, all valid UTF-8 with zero
  # U+FFFD, which is why the replacement-character scan alone reported
  # clean for months while zh-CN, zh-TW, ja and the pt/es locales showed
  # garbled text.  Pure Node, no install step required.
  check-mojibake:
    name: Verify no mojibake in source files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify no U+FFFD or CP1252 markers in tracked files
        run: node scripts/check-mojibake.cjs

  # i18n coverage gate: fail any PR that drops a locale file or
  # introduces drift between an EN source key and a translated
  # value.  Pure Node, no install step required.  `--strict` mode
  # (see scripts/check-i18n-coverage.cjs) makes missing locale
  # files a hard fail.  In default mode (drift informational) the
  # job still reports the table; the strict mode is opt-in for
  # release branches.
  check-i18n-coverage:
    name: Verify i18n locale coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify all locales have all locale files
        run: node scripts/check-i18n-coverage.cjs

  desktop-shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The ROOT install is required here and ONLY here: it supplies the
      # @types/node that platform-core's own `typecheck` needs, and provides
      # `npm run --workspace @cubecloud/platform-core`. agent-desktop installs
      # its own copy separately because it resolves platform-core through a
      # `file:` link, not a workspace hoist — see electron.vite.config.ts.
      #
      # Do not delete this thinking it is redundant: without it the
      # platform-core typecheck step fails with TS2307 for 'fs'/'path'.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck platform-core
        run: npm run typecheck --workspace @cubecloud/platform-core

      - name: Install agent-desktop dependencies
        working-directory: agent-desktop
        run: npm ci

      - name: Typecheck agent-desktop
        working-directory: agent-desktop
        run: npm run typecheck

      - name: Run agent-desktop test suite
        working-directory: agent-desktop
        # `passWithNoTests: true` is set in vitest.config.ts so a narrow local
        # filter can exit clean without matching anything. That setting makes a
        # bare `npm run test` a green that proves nothing: if the include globs
        # ever stopped matching, CI would report success having run zero tests.
        # Assert the counts here so that cannot happen silently.
        run: |
          set -euo pipefail
          npm run test 2>&1 | tee /tmp/vitest.log
          # vitest colourises its summary, and the number is separated from the
          # label by padding, so strip ANSI and allow flexible whitespace.
          clean=$(sed -E 's/\x1b\[[0-9;]*m//g' /tmp/vitest.log)
          files=$(printf '%s' "$clean" | grep -oE 'Test Files[[:space:]]+[0-9]+[[:space:]]+passed' | grep -oE '[0-9]+' | tail -1 || true)
          tests=$(printf '%s' "$clean" | grep -oE 'Tests[[:space:]]+[0-9]+[[:space:]]+passed' | grep -oE '[0-9]+' | tail -1 || true)
          echo "vitest reported: files=${files:-0} tests=${tests:-0}"
          if [ -z "${files:-}" ] || [ "${files:-0}" -lt 100 ]; then
            echo "::error::expected at least 100 test files, got ${files:-0} — did the include globs stop matching?"
            exit 1
          fi
          if [ -z "${tests:-}" ] || [ "${tests:-0}" -lt 1000 ]; then
            echo "::error::expected at least 1000 tests, got ${tests:-0}"
            exit 1
          fi

  # NOTE: The desktop-shell-electron-smoke job was removed in V2.10.73.
  # It referenced `npm run test:electron-smoke`, which was never defined
  # in agent-desktop/package.json. The real CDP smoke suite
  # (`npm run smoke` → scripts/smoke-all.js) requires a running dev
  # electron with ENABLE_CDP=1 CDP_PORT=9222, which is not suitable for
  # headless CI without significant setup. CDP smokes are a local /
  # pre-release manual step — see .github/prompts/audit.prompt.md and
  # .github/skills/agent-desktop-audit/SKILL.md.

  desktop-shell-windows-packaging:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install agent-desktop dependencies
        working-directory: agent-desktop
        run: npm ci

      - name: Build Windows package
        working-directory: agent-desktop
        run: npm run build:win

      - name: Verify packaged Windows app
        working-directory: agent-desktop
        run: npm run verify:bundle

  # `npm run build` succeeding says nothing about `npm run dev`: they bundle
  # differently. On 2026-11-22 the main bundle emitted a runtime
  # `require("@cubecloud/platform-core")` because the workspace package sat in
  # `dependencies` and electron-vite externalizes those. Node then loaded
  # platform-core's raw TypeScript entry, whose relative imports are extensionless
  # (`./ag-ui`), and dev died on startup with ERR_MODULE_NOT_FOUND.
  #
  # Typecheck passed. 1,831 tests passed. The Windows packaging job passed. Every
  # gate was green and the app would not launch, because no gate started it.
  #
  # This job starts dev with CDP enabled and asserts the renderer produced a page
  # target. `scripts/dev-boot-check.cjs` is the same script a developer can run
  # locally; it was proven both ways — it fails with the externalizeDeps exclude
  # removed and passes with it in place.
  desktop-shell-dev-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install agent-desktop dependencies
        working-directory: agent-desktop
        run: npm ci

      # Electron needs a display and a sandbox namespace even when headless.
      - name: Install headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Assert dev boots and exposes the renderer
        working-directory: agent-desktop
        env:
          # Headless CI: run Electron under a virtual display.
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 2
          # electron-builder refuses to run as root without this in containers;
          # the same flag keeps the Chromium sandbox from blocking startup.
          export ELECTRON_DISABLE_SANDBOX=1
          node scripts/dev-boot-check.cjs


  # The kernel container had a broken workspace symlink for an unknown length of
  # time: the image BUILT cleanly, then crash-looped on start with
  # ERR_MODULE_NOT_FOUND for @cubecloud/platform-core, because the runtime stage
  # created the correct absolute symlink and then copied the builder's
  # node_modules/ over it with a relative link that only resolved inside the
  # builder. Nothing gated on the container actually starting.
  #
  # This job builds the real image from the real Dockerfile, boots it, and waits
  # for the healthcheck to pass. A build-only check would not have caught it.
  console-container-smoke:
    name: Container smoke (build + boot + serve)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the kernel image
        run: docker compose -p ci-smoke -f compose.console.yaml build

      - name: Boot it and wait for healthy
        env:
          CONSOLE_KERNEL_TOKEN: ci-smoke-token
        run: |
          docker compose -p ci-smoke -f compose.console.yaml up -d
          # The healthcheck has start_period 10s, interval 30s, retries 3.
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ci-smoke-console-backend-1 2>/dev/null || echo "missing")
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then
              echo "::error::container reported unhealthy"
              docker compose -p ci-smoke -f compose.console.yaml logs --tail=60
              exit 1
            fi
            sleep 5
          done
          if [ "$status" != "healthy" ]; then
            echo "::error::container never became healthy (last status: $status)"
            docker compose -p ci-smoke -f compose.console.yaml logs --tail=60
            exit 1
          fi

      - name: Assert the container serves its capabilities
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:6770/health -o /tmp/health.json
          node -e '
            const h = require("/tmp/health.json");
            if (h.status !== "ok") { console.error("bad status", h.status); process.exit(1); }
            const names = h.routes.map(r => r.name);
            if (!names.includes("dataflowHealth")) {
              console.error("dataflowHealth missing from the kernel route table");
              process.exit(1);
            }
            console.log(`ok: ${h.capabilities} capabilities, dataflowHealth present`);
          '

      - name: Drive the AG-UI endpoint end to end
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/agui.txt -w '%{http_code}' \
            -X POST http://127.0.0.1:6770/api/ag-ui/run \
            -H 'content-type: application/json' \
            -H 'x-console-token: ci-smoke-token' \
            -H 'origin: http://127.0.0.1:6770' \
            -d '{"threadId":"ci","runId":"ci","messages":[{"role":"user","content":"hi"}]}')
          test "$code" = "200" || { echo "::error::AG-UI returned $code"; cat /tmp/agui.txt; exit 1; }
          grep -q 'RUN_STARTED' /tmp/agui.txt || { echo "::error::no RUN_STARTED"; cat /tmp/agui.txt; exit 1; }
          # A run that finishes successfully must have carried text. A
          # RUN_FINISHED with neither text nor a tool call is a silent turn:
          # the kernel is up but cannot reach or authenticate to the runtime,
          # which is exactly how this shipped broken.
          if grep -q 'RUN_ERROR' /tmp/agui.txt; then
            echo "ok: AG-UI reported the turn error truthfully"
            grep -o '"message":"[^"]*"' /tmp/agui.txt | head -1 || true
          else
            grep -q 'RUN_FINISHED' /tmp/agui.txt || { echo "::error::run did not terminate"; cat /tmp/agui.txt; exit 1; }
            grep -qE '"type":"(TEXT_MESSAGE_CONTENT|TOOL_CALL_START)"' /tmp/agui.txt || {
              echo "::error::RUN_FINISHED with no text and no tool call — a silent turn"; cat /tmp/agui.txt; exit 1; }
            echo "ok: AG-UI streamed RUN_STARTED -> content -> RUN_FINISHED"
          fi

      # "Up" and "can think" are different states, and this job exists
      # because the difference was invisible. The kernel boots healthy with
      # no runtime reachable at all: health is its own process, not the
      # gateway's. This step asserts the transport *selection* is right by
      # proving the kernel resolves the configured runtime URL rather than
      # its own loopback — the defect that produced `spawn … ENOENT` from a
      # container that ships no Hermes binary.
      - name: Assert the kernel targets the configured runtime, not its own loopback
        run: |
          set -euo pipefail
          # The container's own 127.0.0.1:8642 must NOT be the target.
          docker compose -p ci-smoke -f compose.console.yaml exec -T console-backend \
            printenv CONSOLE_RUNTIME_BASE_URL | grep -q 'host.docker.internal:8642' \
            || { echo "::error::kernel is not pointed at the host runtime"; docker compose -p ci-smoke -f compose.console.yaml exec -T console-backend printenv CONSOLE_RUNTIME_BASE_URL || true; exit 1; }
          # And the resolution helper must honour it rather than returning the
          # hard-coded loopback default.
          docker compose -p ci-smoke -f compose.console.yaml exec -T console-backend sh -c \
            'grep -q "getApiUrlWithEnvOverride()}/health" /app/src/main/hermes.ts' \
            || { echo "::error::the API-server health gate does not use the env-aware URL"; exit 1; }
          echo "ok: runtime targeting is configuration-driven"

      - name: Tear down
        if: always()
        run: docker compose -p ci-smoke -f compose.console.yaml down -v