name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Structural docs check: fail any PR that hard-codes a skill
  # count in prose. Pure Node, no install step required.
  # The accepted forms are {{SKILLS_TOTAL}}, {{SKILLS_UPSTREAM}},
  # {{SKILLS_REPOS}} — see scripts/skill-counts.cjs for the
  # source of truth. This gate is what makes the prose count
  # drift impossible: the next skill-add that forgets to update
  # the count will fail CI rather than silently land.
  check-skill-counts:
    name: Verify skill counts in prose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify no hard-coded skill counts in prose
        run: node scripts/check-skill-counts.cjs

  desktop-shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck platform-core
        run: npm run typecheck --workspace @cubecloud/platform-core

      - name: Typecheck desktop-shell
        run: npm run typecheck --workspace @cubecloud/desktop-shell

      - name: Run focused desktop-shell tests
        run: npm run test --workspace @cubecloud/desktop-shell -- App.gateway.dom.test.tsx src/renderer/src/App.kanban.dom.test.tsx src/main/runtimeSessions.test.ts

  desktop-shell-electron-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron UI smoke test
        run: npm run test:electron-smoke --workspace @cubecloud/desktop-shell

  desktop-shell-windows-packaging:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        run: npm run build:win --workspace @cubecloud/desktop-shell

      - name: Verify packaged Windows app
        run: npm run verify:win-package --workspace @cubecloud/desktop-shell
