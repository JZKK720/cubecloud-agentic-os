name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all build jobs but skip publish (no tag, no GitHub Release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

defaults:
  run:
    working-directory: agent-desktop

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.check.outputs.exists }}
      is_dry_run: ${{ steps.mode.outputs.is_dry_run }}
      should_build: ${{ steps.should_build.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: v$VERSION"

      - name: Check if a release already exists for this version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately checks the RELEASE, not the tag.
          #
          # The previous check was `git ls-remote --tags`, which is true for
          # every tag-push trigger — the tag exists on origin by definition,
          # because pushing it is what started this workflow. The publish job
          # then required `tag_exists == 'false'`, so a tag push could never
          # publish. That is why v2.10.77, v2.10.78 and v2.10.79 carry tags
          # with no GitHub Release behind them and the last shipped build is
          # v2.10.75.
          #
          # "Should we publish?" is about whether a release exists, not
          # whether a tag does. The publish job re-creates the tag
          # idempotently, so a pre-existing tag is harmless.
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists — publish will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release for v${{ steps.version.outputs.version }} yet — publish may run."
          fi

      - name: Compute dry-run flag
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "is_dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: builds will run, publish will be skipped."
          else
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Real release: publish will run if tag does not exist."
          fi

      - name: Decide whether to build
        id: should_build
        run: |
          # Build jobs should always run on workflow_dispatch (the user
          # explicitly triggered it). On tag push, use github.event.created
          # to distinguish a new tag creation (created=true → build) from a
          # re-push/update (created=false → skip). Querying git ls-remote is
          # unreliable here because the tag always exists on origin by the
          # time the workflow runs on a push: tags trigger.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch —builds will run regardless of tag state."
          elif [ "${{ github.event.created }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "New tag push —builds will run."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Tag re-push or update —skipping builds."
          fi

  release_windows:
    name: Build Windows
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: npm run build

      - name: Package Windows artifacts
        run: npx electron-builder --project . --win nsis portable --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            agent-desktop/dist/*.exe
            agent-desktop/dist/*.exe.blockmap
            agent-desktop/dist/latest.yml

  generate_winget:
    name: Generate winget manifests
    needs: [prepare, release_windows]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: agent-desktop/dist/

      - name: Generate winget manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_OWNER: JZKK720
          PUBLISH_REPO: cubecloud-agentic-os
        run: node scripts/generate-winget-manifests.mjs

      - name: Upload winget manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ needs.prepare.outputs.version }}
          path: agent-desktop/dist/winget/

  publish:
    name: Publish Release
    # `generate_winget` is deliberately NOT a dependency. winget manifests are a
    # nice-to-have distribution channel and that job needs a separate token; if
    # it fails or is skipped, the Windows installer — the artifact users actually
    # download — must still get released. Requiring it made a peripheral job
    # gate the whole release.
    needs: [prepare, release_windows]
    if: needs.prepare.outputs.is_dry_run == 'false' && needs.prepare.outputs.tag_exists == 'false' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG=${{ needs.prepare.outputs.tag }}
          # A tag-push trigger already has its tag on origin, so creating it
          # again must be a no-op rather than a failure. A manual dispatch on
          # an untagged commit creates it here.
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already on origin — nothing to create."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # Absolute, because this workflow's default `working-directory` is
          # `agent-desktop`: a bare `artifacts` downloaded there, while the
          # step below reads `$GITHUB_WORKSPACE/artifacts`. That mismatch made
          # the metadata step fail with ENOENT scandir and blocked publishing.
          path: ${{ github.workspace }}/artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: cubecloud-agent-desktop ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest.yml
