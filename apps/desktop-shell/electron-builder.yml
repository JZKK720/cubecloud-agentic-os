appId: io.cubecloud.agentdesktop
productName: Agent Desktop
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - resources/**
  - '!**/*.tsbuildinfo'
  - '!src/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!tmp-root-shell-screen.png'
asarUnpack:
  - resources/**
win:
  executableName: agent-desktop
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  icon: build/icon.icns
linux:
  icon: build/icon.png
  category: Utility
  synopsis: Agent Desktop for Cubecloud Agentic-OS
  description: >-
    Agent Desktop is the Cubecloud runtime shell for local Hermes onboarding,
    gateway operations, and multi-lane agent orchestration.
npmRebuild: false
